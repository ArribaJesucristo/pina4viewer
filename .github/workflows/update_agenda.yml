name: Actualizar Agenda PIÑAVISION

on:
  schedule:
    # Cada 20 minutos en minutos fuera de hora punta (7, 27, 47) para evitar saturación de colas en GitHub
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: update-agenda
  cancel-in-progress: true

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar agenda PIÑAVISION
        run: python scripts/generate_agenda.py

      - name: Commit y push cambios si hay actualizacion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(agenda): actualizar agenda PIÑAVISION [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
