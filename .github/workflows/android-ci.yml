name: Android & Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Backend & Agenda Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile & Validate Python Scripts
        run: python -m py_compile scripts/generate_agenda.py scripts/test_agenda.py scripts/upload_release.py
      - name: Run Agenda Unit Tests
        run: python -m unittest -v scripts.test_agenda

  android-build-and-test:
    name: Android Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pina4viewer-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests, Lint & Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: pina4viewer-kotlin/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pina4viewer-debug-apk
          path: pina4viewer-kotlin/app/build/outputs/apk/debug/app-debug.apk
